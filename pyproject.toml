# Packaging metadata. The project runs fine from a source checkout
# (`python -m app.main`), so this exists mainly to declare the Python floor in a
# machine-readable place and to configure the dev tools.

[project]
name = "ghostball"
version = "0.1.0"
description = "GhostBall -- projection-mapped AR pool for Raspberry Pi 5"
# 3.10 minimum: dataclass(slots=True) and PEP 604 unions in Pydantic schemas.
# Bookworm ships 3.11. See app/__init__.py for the matching runtime guard.
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
# projection.patterns.TestPattern is an enum of projector test patterns, not a
# test class. Without this, importing it into a test module produces a
# collection warning on every run.

# The application is imported as top-level packages (app, vision, physics...),
# so pytest must run with the project root on sys.path.
pythonpath = ["."]
filterwarnings = [
    # projection.patterns.TestPattern is an enum of projector test patterns, not
    # a test class, but pytest tries to collect anything named Test*. Importing
    # it into a test module otherwise warns on every run.
    "ignore:cannot collect test class 'TestPattern':pytest.PytestCollectionWarning",
    # starlette's TestClient uses httpx's deprecated `app=` shortcut. Pinned
    # httpx<0.28 in requirements.txt keeps it working; silence the noise.
    "ignore:The 'app' shortcut is now deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py310"
preview = true

[tool.ruff.lint]
# PLW1514 (preview): open() without an explicit encoding. Included because the
# default is locale-specific, so a file written on a Windows dev box and read on
# the Pi -- or vice versa -- silently differs. That exact split already bit once,
# in a test harness reading a subprocess's UTF-8 output.
select = ["E", "F", "W", "I", "UP", "B", "PLW1514"]
ignore = [
    # Stub modules intentionally accept arguments they do not yet use.
    "ARG001",
]
